# 集群内跑几个 tracepipe 副本，接收全集群应用上报的 OTLP trace 写进 ClickHouse。
# 和 logpipe 不同，这是 push 模型：应用主动发过来，所以是 Deployment + Service，
# 不是 DaemonSet；不需要读宿主机文件，也不需要 root。
---
apiVersion: v1
kind: Namespace
metadata:
  name: tracing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracepipe-config
  namespace: tracing
data:
  tracepipe.yaml: |
    source:
      type: otlp
      grpc: 0.0.0.0:4317
      http: 0.0.0.0:4318
      max_request_bytes: 16777216
      enqueue_timeout_secs: 5
      # 写失败让 SDK 重发，不用磁盘缓冲也至少一次；要更低的导出延迟就关掉
      wait_for_write: true

    sink:
      type: clickhouse
      endpoint: http://clickhouse.logging.svc.cluster.local:8123
      database: logs
      table: otel_trace
      # ClickHouse 集群名。填了就写 Distributed 表、DDL 带 ON CLUSTER；
      # 改了这里要同步改 tracepipe-ddl-job.yaml 的 CH_CLUSTER
      # cluster: bj_ck
      # 和 logpipe 的日志表配成同一个时区，两张表按 trace_id 对照时时间才是同一口径
      timezone: Asia/Shanghai
      user: default
      password: ""
      # 多副本各自小批量写，让服务端再攒一层
      async_insert: true
      timeout_secs: 30

    batch:
      max_events: 20000
      timeout_secs: 2

    pipeline:
      require_healthy: true
      on_error: stop

    fields:
      cluster: bj-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracepipe
  namespace: tracing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tracepipe
  template:
    metadata:
      labels:
        app: tracepipe
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: tracepipe
          # 打 v* tag 由 CI 推到 GHCR，见 README「发布」
          image: ghcr.io/easayliu/trace:v0.2.0
          args: ["/etc/tracepipe/tracepipe.yaml"]
          env:
            - name: RUST_LOG
              value: info
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          # 起来之后端口才通；HTTP 端口对非 POST 回 405，能证明进程活着就够了
          readinessProbe:
            tcpSocket:
              port: otlp-grpc
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: otlp-grpc
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/tracepipe
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: tracepipe-config
---
# 应用把 OTEL_EXPORTER_OTLP_ENDPOINT 指到 http://tracepipe.tracing.svc.cluster.local:4317
apiVersion: v1
kind: Service
metadata:
  name: tracepipe
  namespace: tracing
spec:
  selector:
    app: tracepipe
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
